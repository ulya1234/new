<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Document Editor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --doc-bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #18181b);
      --hint: var(--tg-theme-hint-color, #71717a);
      --link: var(--tg-theme-link-color, #0284c7);
      --btn: var(--tg-theme-button-color, #0284c7);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(0, 0, 0, 0.12);
      --hover: rgba(0, 0, 0, 0.05);
      --active-bg: rgba(2, 132, 199, 0.15);
      --active-text: #0284c7;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }
    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }
    .tab-group {
      display: flex;
      background: var(--doc-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }
    .tab-item {
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--hint);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-item.active {
      background: var(--bg);
      color: var(--text);
    }
    .toolbar-container {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--doc-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toolbar-container::-webkit-scrollbar {
      display: none;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 3px;
      width: max-content;
    }
    .divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }
    .tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tool-btn:hover {
      background: var(--hover);
    }
    .tool-btn.active-tool {
      background: var(--active-bg);
      color: var(--active-text);
      transform: scale(0.96);
    }
    .tool-btn svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.2;
    }
    .doc-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--doc-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      min-height: 420px;
      overflow: hidden;
    }
    #editor-visual, #editor-markdown {
      flex: 1;
      width: 100%;
      min-height: 420px;
      padding: 24px;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text);
      outline: none;
      overflow-y: auto;
    }
    #editor-markdown {
      display: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background: var(--doc-bg);
      white-space: pre-wrap;
      word-break: break-word;
    }
    #editor-visual:empty:before {
      content: attr(data-placeholder);
      color: var(--hint);
      pointer-events: none;
      display: block;
    }
    #editor-visual b, #editor-visual strong {
      font-weight: 700;
    }
    #editor-visual i, #editor-visual em {
      font-style: italic;
    }
    #editor-visual u {
      text-decoration: underline;
    }
    #editor-visual s, #editor-visual strike, #editor-visual del {
      text-decoration: line-through;
      opacity: 0.7;
    }
    #editor-visual h1, #editor-visual h2, #editor-visual h3 {
      font-weight: 700;
      margin: 16px 0 8px 0;
      color: var(--text);
    }
    #editor-visual code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: var(--link);
    }
    #editor-visual blockquote {
      border-left: 3px solid var(--link);
      margin: 12px 0;
      padding-left: 14px;
      color: var(--hint);
      font-style: italic;
    }
    #editor-visual table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 14px;
    }
    #editor-visual th, #editor-visual td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }
    #editor-visual th {
      background: var(--bg);
      font-weight: 600;
    }
    #editor-visual details {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 12px 0;
      background: var(--bg);
    }
    #editor-visual summary {
      font-weight: 600;
      cursor: pointer;
      color: var(--link);
    }
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 12px;
      color: var(--hint);
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: var(--doc-bg);
      width: 100%;
      max-width: 340px;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .modal h2 {
      font-size: 16px;
      font-weight: 600;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 12px;
      color: var(--hint);
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--doc-bg);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-secondary {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-primary {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <span class="brand-title">Document</span>
    <div class="tab-group">
      <button class="tab-item active" id="btnTabVisual" onclick="switchTab('visual')">Editor</button>
      <button class="tab-item" id="btnTabMarkdown" onclick="switchTab('markdown')">Markdown</button>
    </div>
  </div>

  <div class="toolbar-container" id="toolbarContainer">
    <div class="toolbar">
      <button class="tool-btn" id="btnBold" onmousedown="event.preventDefault(); execFormat('bold')" ontouchstart="event.preventDefault(); execFormat('bold')" title="Bold"><i data-lucide="bold"></i></button>
      <button class="tool-btn" id="btnItalic" onmousedown="event.preventDefault(); execFormat('italic')" ontouchstart="event.preventDefault(); execFormat('italic')" title="Italic"><i data-lucide="italic"></i></button>
      <button class="tool-btn" id="btnUnderline" onmousedown="event.preventDefault(); execFormat('underline')" ontouchstart="event.preventDefault(); execFormat('underline')" title="Underline"><i data-lucide="underline"></i></button>
      <button class="tool-btn" id="btnStrike" onmousedown="event.preventDefault(); execFormat('strikeThrough')" ontouchstart="event.preventDefault(); execFormat('strikeThrough')" title="Strikethrough"><i data-lucide="strikethrough"></i></button>
      <div class="divider"></div>
      <button class="tool-btn" onmousedown="event.preventDefault(); execFormat('formatBlock', '<h2>')" ontouchstart="event.preventDefault(); execFormat('formatBlock', '<h2>')" title="Heading"><i data-lucide="heading"></i></button>
      <button class="tool-btn" onmousedown="event.preventDefault(); insertInlineCode()" ontouchstart="event.preventDefault(); insertInlineCode()" title="Inline Code"><i data-lucide="code"></i></button>
      <button class="tool-btn" onmousedown="event.preventDefault(); insertMathFormula()" ontouchstart="event.preventDefault(); insertMathFormula()" title="LaTeX Equation"><i data-lucide="sigma"></i></button>
      <div class="divider"></div>
      <button class="tool-btn" id="btnUl" onmousedown="event.preventDefault(); execFormat('insertUnorderedList')" ontouchstart="event.preventDefault(); execFormat('insertUnorderedList')" title="Bullet List"><i data-lucide="list"></i></button>
      <button class="tool-btn" id="btnOl" onmousedown="event.preventDefault(); execFormat('insertOrderedList')" ontouchstart="event.preventDefault(); execFormat('insertOrderedList')" title="Numbered List"><i data-lucide="list-ordered"></i></button>
      <button class="tool-btn" onmousedown="event.preventDefault(); execFormat('formatBlock', '<blockquote>')" ontouchstart="event.preventDefault(); execFormat('formatBlock', '<blockquote>')" title="Quote"><i data-lucide="quote"></i></button>
      <div class="divider"></div>
      <button class="tool-btn" onmousedown="event.preventDefault(); insertCollapsibleBlock()" ontouchstart="event.preventDefault(); insertCollapsibleBlock()" title="Collapsible Details"><i data-lucide="folder-kanban"></i></button>
      <button class="tool-btn" onmousedown="event.preventDefault(); openTableModal()" ontouchstart="event.preventDefault(); openTableModal()" title="Insert Table"><i data-lucide="table"></i></button>
    </div>
  </div>

  <div class="doc-page">
    <div id="editor-visual" contenteditable="true" data-placeholder="Start typing your document here... "></div>
    <div id="editor-markdown"></div>
  </div>

  <div class="footer-bar">
    <span id="charCount">0 characters</span>
    <span id="blockCount">1 block</span>
  </div>

  <div class="modal-overlay" id="tableModal">
    <div class="modal">
      <h2>Insert Table</h2>
      <div class="grid-2">
        <div class="input-group">
          <label>Rows</label>
          <input type="number" id="tblRows" value="3" min="1" max="15" />
        </div>
        <div class="input-group">
          <label>Columns</label>
          <input type="number" id="tblCols" value="2" min="1" max="6" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeTableModal()">Cancel</button>
        <button class="btn-primary" onclick="insertTable()">Insert</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    lucide.createIcons();

    const visualEditor = document.getElementById("editor-visual");
    const markdownEditor = document.getElementById("editor-markdown");
    const charCountEl = document.getElementById("charCount");
    const blockCountEl = document.getElementById("blockCount");

    let savedRange = null;

    function saveSelection() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && visualEditor.contains(sel.anchorNode)) {
        savedRange = sel.getRangeAt(0).cloneRange();
      }
      updateActiveStates();
    }

    function restoreSelection() {
      if (savedRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
    }

    function updateActiveStates() {
      const boldBtn = document.getElementById("btnBold");
      const italicBtn = document.getElementById("btnItalic");
      const underlineBtn = document.getElementById("btnUnderline");
      const strikeBtn = document.getElementById("btnStrike");
      const ulBtn = document.getElementById("btnUl");
      const olBtn = document.getElementById("btnOl");

      const isBold = document.queryCommandState("bold");
      const isItalic = document.queryCommandState("italic");
      const isUnderline = document.queryCommandState("underline");
      const isStrike = document.queryCommandState("strikeThrough");
      const isUl = document.queryCommandState("insertUnorderedList");
      const isOl = document.queryCommandState("insertOrderedList");

      boldBtn.classList.toggle("active-tool", isBold);
      italicBtn.classList.toggle("active-tool", isItalic);
      underlineBtn.classList.toggle("active-tool", isUnderline);
      strikeBtn.classList.toggle("active-tool", isStrike);
      ulBtn.classList.toggle("active-tool", isUl);
      olBtn.classList.toggle("active-tool", isOl);
    }

    document.addEventListener("selectionchange", saveSelection);
    visualEditor.addEventListener("keyup", saveSelection);
    visualEditor.addEventListener("mouseup", saveSelection);
    visualEditor.addEventListener("touchend", saveSelection);
    visualEditor.addEventListener("input", updateStatistics);

    function execFormat(command, value = null) {
      visualEditor.focus();
      restoreSelection();
      document.execCommand(command, false, value);
      saveSelection();
      updateStatistics();
    }

    function insertInlineCode() {
      visualEditor.focus();
      restoreSelection();
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      const text = range.toString() || "code";
      const codeEl = document.createElement("code");
      codeEl.innerText = text;
      range.deleteContents();
      range.insertNode(codeEl);
      sel.collapseToEnd();
      saveSelection();
      updateStatistics();
    }

    function insertMathFormula() {
      const mathText = prompt("Enter LaTeX math formula:", "E = mc^2");
      if (!mathText) return;
      visualEditor.focus();
      restoreSelection();
      document.execCommand("insertText", false, ` $${mathText}$ `);
      saveSelection();
      updateStatistics();
    }

    function insertCollapsibleBlock() {
      const detailsHtml = `<br><details open><summary><b>Collapsible Section</b></summary><p>Write your content here...</p></details><br>`;
      visualEditor.focus();
      restoreSelection();
      document.execCommand("insertHTML", false, detailsHtml);
      saveSelection();
      updateStatistics();
    }

    function openTableModal() {
      document.getElementById("tableModal").classList.add("active");
    }

    function closeTableModal() {
      document.getElementById("tableModal").classList.remove("active");
    }

    function insertTable() {
      const rows = parseInt(document.getElementById("tblRows").value, 10) || 2;
      const cols = parseInt(document.getElementById("tblCols").value, 10) || 2;

      let tableHtml = "<table><thead><tr>";
      for (let c = 1; c <= cols; c++) {
        tableHtml += `<th>Header ${c}</th>`;
      }
      tableHtml += "</tr></thead><tbody>";

      for (let r = 1; r <= rows; r++) {
        tableHtml += "<tr>";
        for (let c = 1; c <= cols; c++) {
          tableHtml += `<td>Cell ${r}-${c}</td>`;
        }
        tableHtml += "</tr>";
      }
      tableHtml += "</tbody></table><br>";

      visualEditor.focus();
      restoreSelection();
      document.execCommand("insertHTML", false, tableHtml);
      closeTableModal();
      saveSelection();
      updateStatistics();
    }

    function compileHtmlToTelegramMarkdown(node) {
      let markdown = "";
      const children = node.childNodes;

      for (let i = 0; i < children.length; i++) {
        const child = children[i];

        if (child.nodeType === Node.TEXT_NODE) {
          markdown += child.textContent;
        } else if (child.nodeType === Node.ELEMENT_NODE) {
          const tag = child.nodeName.toLowerCase();

          if (tag === "b" || tag === "strong") {
            markdown += `**${compileHtmlToTelegramMarkdown(child)}**`;
          } else if (tag === "i" || tag === "em") {
            markdown += `*${compileHtmlToTelegramMarkdown(child)}*`;
          } else if (tag === "u") {
            markdown += `__${compileHtmlToTelegramMarkdown(child)}__`;
          } else if (tag === "s" || tag === "strike" || tag === "del") {
            markdown += `~~${compileHtmlToTelegramMarkdown(child)}~~`;
          } else if (tag === "code") {
            markdown += `\`${child.textContent}\``;
          } else if (tag === "h1" || tag === "h2" || tag === "h3") {
            markdown += `\n## ${compileHtmlToTelegramMarkdown(child).trim()}\n\n`;
          } else if (tag === "blockquote") {
            const lines = compileHtmlToTelegramMarkdown(child).trim().split("\n");
            markdown += "\n" + lines.map(line => `> ${line}`).join("\n") + "\n\n";
          } else if (tag === "ul" || tag === "ol") {
            const items = child.querySelectorAll("li");
            items.forEach((li, idx) => {
              const prefix = tag === "ol" ? `${idx + 1}. ` : "- ";
              markdown += `${prefix}${compileHtmlToTelegramMarkdown(li).trim()}\n`;
            });
            markdown += "\n";
          } else if (tag === "table") {
            const trs = child.querySelectorAll("tr");
            trs.forEach((row, rowIndex) => {
              const cells = row.querySelectorAll("th, td");
              let rowStr = "|";
              cells.forEach(cell => {
                rowStr += ` ${compileHtmlToTelegramMarkdown(cell).trim()} |`;
              });
              markdown += rowStr + "\n";
              if (rowIndex === 0) {
                let divStr = "|";
                cells.forEach(() => { divStr += ":---|"; });
                markdown += divStr + "\n";
              }
            });
            markdown += "\n";
          } else if (tag === "details") {
            const summary = child.querySelector("summary");
            const summaryText = summary ? compileHtmlToTelegramMarkdown(summary).trim() : "Details";
            const clone = child.cloneNode(true);
            const cloneSummary = clone.querySelector("summary");
            if (cloneSummary) cloneSummary.remove();
            const bodyText = compileHtmlToTelegramMarkdown(clone).trim();
            markdown += `\n<details open><summary>${summaryText}</summary>\n\n${bodyText}\n\n</details>\n\n`;
          } else if (tag === "br" || tag === "div" || tag === "p") {
            markdown += `${compileHtmlToTelegramMarkdown(child)}\n`;
          } else {
            markdown += compileHtmlToTelegramMarkdown(child);
          }
        }
      }
      return markdown;
    }

    function switchTab(mode) {
      const btnVisual = document.getElementById("btnTabVisual");
      const btnMarkdown = document.getElementById("btnTabMarkdown");
      const toolbarContainer = document.getElementById("toolbarContainer");

      if (mode === "visual") {
        btnVisual.classList.add("active");
        btnMarkdown.classList.remove("active");
        toolbarContainer.style.display = "block";
        visualEditor.style.display = "block";
        markdownEditor.style.display = "none";
      } else {
        btnMarkdown.classList.add("active");
        btnVisual.classList.remove("active");
        toolbarContainer.style.display = "none";
        visualEditor.style.display = "none";
        markdownEditor.style.display = "block";
        markdownEditor.innerText = compileHtmlToTelegramMarkdown(visualEditor).trim();
      }
      updateStatistics();
    }

    function updateStatistics() {
      const text = visualEditor.innerText || "";
      const charCount = text.length;
      const blocks = visualEditor.querySelectorAll("h1, h2, h3, p, table, details, blockquote, li").length || 1;

      charCountEl.innerText = `${charCount.toLocaleString()} characters`;
      blockCountEl.innerText = `${blocks} ${blocks === 1 ? 'block' : 'blocks'}`;
    }

    tg.MainButton.setText("SEND ARTICLE");
    tg.MainButton.show();
    tg.MainButton.onClick(() => {
      const generatedMarkdown = compileHtmlToTelegramMarkdown(visualEditor).trim();
      if (!generatedMarkdown) {
        tg.showAlert("Please enter some content before sending.");
        return;
      }

      tg.sendData(JSON.stringify({ markdown: generatedMarkdown }));
    });
  </script>
</body>
</html>
